<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-react 검증 페이지</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 1rem;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      #real {
        border: 1px solid #888;
        padding: 0.5rem;
        min-height: 10rem;
      }
      #test {
        box-sizing: border-box;
        width: 100%;
        font-family: monospace;
      }
      #demo-section {
        margin-top: 1rem;
      }
      #message {
        color: #b00020;
        min-height: 1.5em;
      }
      /* 순위 페이지: 왼쪽은 Root Component가 그리는 container, 오른쪽은 Hook 패널입니다. */
      #ranking-section {
        margin-top: 2rem;
        min-height: 100vh;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      #ranking-notice {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        background: #e8f0fe;
        color: #174ea6;
        min-height: 1.5em;
      }
      .ranking-layout {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 1rem;
        align-items: start;
      }
      #ranking .reader {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      #ranking section,
      #hook-panel {
        border: 1px solid #c4c7c5;
        border-radius: 8px;
        padding: 0.75rem 1rem;
      }
      #ranking h3,
      #hook-panel h3 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      #ranking ul,
      #ranking ol {
        margin: 0;
        padding: 0;
        list-style-position: inside;
      }
      #ranking li {
        display: grid;
        grid-template-columns: 1fr 5rem auto auto auto;
        gap: 0.5rem;
        align-items: center;
        padding: 0.35rem 0.25rem;
        border-bottom: 1px solid #eee;
      }
      #ranking ol {
        counter-reset: rank;
      }
      #ranking ol li {
        grid-template-columns: 1.5rem 1fr 5rem auto;
        counter-increment: rank;
      }
      #ranking ol li::before {
        content: counter(rank);
        color: #5f6368;
      }
      #ranking .track {
        color: #5f6368;
        font-size: 0.85rem;
      }
      #ranking .score {
        min-width: 1.5rem;
        text-align: center;
      }
      #ranking button {
        font: inherit;
        padding: 0.15rem 0.6rem;
        border: 1px solid #888;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      #ranking button:focus-visible {
        outline: 3px solid #1a73e8;
        outline-offset: 1px;
      }
      #ranking .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem;
        margin: 0 0 0.5rem;
      }
      #ranking .tab {
        padding: 0.1rem 0.4rem;
        font-size: 0.85rem;
      }
      #ranking .tab.selected {
        background: #1a73e8;
        border-color: #1a73e8;
        color: #fff;
      }
      #ranking .toggle {
        margin-bottom: 0.5rem;
      }
      #hook-panel {
        font-size: 0.9rem;
      }
      #hook-panel .stages {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #hook-panel .stage {
        padding: 0.15rem 0.35rem;
        border: 1px solid #c4c7c5;
        border-radius: 6px;
        color: #9aa0a6;
        font-family: monospace;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      #hook-panel .stage.ran {
        animation: stage-on 250ms both;
      }
      @keyframes stage-on {
        from {
          background: #fff;
          border-color: #c4c7c5;
          color: #9aa0a6;
        }
        to {
          background: #1a73e8;
          border-color: #1a73e8;
          color: #fff;
        }
      }
      #hook-panel .panel-message {
        margin: 0.5rem 0 1rem;
        min-height: 1.5em;
      }
      #hook-panel .cells {
        margin: 0 0 1rem;
        padding: 0;
        list-style: none;
      }
      /* 윗줄: 칸 번호, Hook 이름, 결과. 아랫줄: 칸의 값. */
      #hook-panel .cells li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        column-gap: 0.5rem;
        padding: 0.3rem 0.25rem;
        border-bottom: 1px solid #eee;
      }
      #hook-panel .cell-index,
      #hook-panel .cell-value,
      #hook-panel-patches {
        font-family: monospace;
      }
      #hook-panel .cell-index {
        color: #5f6368;
      }
      #hook-panel .cell-value {
        grid-column: 1 / -1;
        color: #174ea6;
      }
      #hook-panel .cell-result {
        white-space: nowrap;
        color: #9aa0a6;
      }
      #hook-panel li[data-result="changed"],
      #hook-panel li[data-result="recomputed"],
      #hook-panel li[data-result="ran"] {
        background: #fff4e5;
      }
      #hook-panel li[data-result="changed"] .cell-result,
      #hook-panel li[data-result="recomputed"] .cell-result,
      #hook-panel li[data-result="ran"] .cell-result {
        color: #b3261e;
        font-weight: bold;
      }
      #hook-panel-patches {
        margin: 0;
        padding-left: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h1>mini-react 검증 페이지</h1>
    <main>
      <section>
        <h2>실제 영역</h2>
        <!-- 샘플의 줄 앞 공백도 View의 글자 노드가 되므로, 샘플은 들여쓰지 않습니다. -->
        <div id="real"><section class="sample">
<h3>할 일</h3>
<p>오늘 할 일을 <strong>세 개</strong> 적었습니다.</p>
<ul>
<li>장보기</li>
<li>운동</li>
<li>책 읽기</li>
</ul>
<label>메모 <input type="text" value="첫 메모"></label>
</section></div>
      </section>
      <section>
        <h2>테스트 영역</h2>
        <label for="test">HTML을 고친 뒤 Patch를 누르세요.</label>
        <textarea id="test" rows="16" spellcheck="false"></textarea>
        <p>
          <button id="back" type="button">뒤로가기</button>
          <button id="patch" type="button">Patch</button>
          <button id="forward" type="button">앞으로가기</button>
        </p>
        <p id="message" role="status"></p>
        <h2>마지막으로 적용한 Patch</h2>
        <ol id="patch-log"></ol>
      </section>
    </main>
    <section id="demo-section">
      <h2>데모 페이지</h2>
      <div id="demo">
      </div>
    </section>
    <section id="ranking-section">
      <h2>순위 페이지</h2>
      <p id="ranking-notice" role="status"></p>
      <div class="ranking-layout">
        <div id="ranking"></div>
        <aside id="hook-panel"></aside>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
