<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-react 검증 페이지</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 1rem;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      #real {
        border: 1px solid #888;
        padding: 0.5rem;
        min-height: 10rem;
      }
      #test {
        box-sizing: border-box;
        width: 100%;
        font-family: monospace;
      }
      #demo-section {
        margin-top: 1rem;
      }
      #message {
        color: #b00020;
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <h1>mini-react 검증 페이지</h1>
    <main>
      <section>
        <h2>실제 영역</h2>
        <!-- 샘플의 줄 앞 공백도 View의 글자 노드가 되므로, 샘플은 들여쓰지 않습니다. -->
        <div id="real"><section class="sample">
<h3>할 일</h3>
<p>오늘 할 일을 <strong>세 개</strong> 적었습니다.</p>
<ul>
<li>장보기</li>
<li>운동</li>
<li>책 읽기</li>
</ul>
<label>메모 <input type="text" value="첫 메모"></label>
</section></div>
      </section>
      <section>
        <h2>테스트 영역</h2>
        <label for="test">HTML을 고친 뒤 Patch를 누르세요.</label>
        <textarea id="test" rows="16" spellcheck="false"></textarea>
        <p>
          <button id="back" type="button">뒤로가기</button>
          <button id="patch" type="button">Patch</button>
          <button id="forward" type="button">앞으로가기</button>
        </p>
        <p id="message" role="status"></p>
        <h2>마지막으로 적용한 Patch</h2>
        <ol id="patch-log"></ol>
      </section>
    </main>
    <section id="demo-section">
      <h2>데모 페이지</h2>
      <div id="demo">
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
